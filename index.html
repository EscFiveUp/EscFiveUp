<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт снят с публикации</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: grad 8s ease infinite;
            color: #fff;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes grad {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes logoAppear {
            from { opacity: 0; transform: scale(.85); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes escAppear {
            from { opacity: 0; transform: translateX(-40px) rotate(-15deg); }
            to   { opacity: 1; transform: translateX(0) rotate(0); }
        }

        @keyframes fiveAppear {
            from { opacity: 0; transform: translateX(-20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1);    box-shadow: 0 0 30px rgba(255,255,255,.3); }
            50%      { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,255,255,.6); }
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, -30px) scale(1.1); }
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::before { top: -200px; left: -200px;  animation: floatBlob 10s ease-in-out infinite; }
        body::after  { bottom: -200px; right: -200px; animation: floatBlob 12s ease-in-out infinite reverse; }

        .offline-card {
            position: relative;
            z-index: 2;
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, .35);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
            text-align: center;
            animation: fadeIn .7s ease;
        }

        /* ===== ЛОГОТИП ===== */
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            user-select: none;
            margin-bottom: 24px;
            opacity: 0;
            animation: logoAppear .7s cubic-bezier(.2,.9,.3,1.4) .2s forwards;
        }

        .esc-key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 4px 0 #0a0a0a, 0 6px 10px rgba(0, 0, 0, 0.3);
            transform: translateX(-40px) rotate(-15deg);
            opacity: 0;
            animation: escAppear .6s cubic-bezier(.2,.9,.3,1.4) .3s forwards;
        }

        .esc-text {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .fiveup-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
            transform: translateX(-20px);
            opacity: 0;
            animation: fiveAppear .6s cubic-bezier(.2,.9,.3,1.4) .55s forwards;
        }

        .five {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .up {
            font-size: 32px;
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
        }

        /* ===== ИКОНКА ===== */
        .offline-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .18);
            border: 2px solid rgba(255, 255, 255, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            animation: pulseIcon 2.4s ease-in-out infinite;
        }

        .offline-icon i { color: #fff; }

        /* ===== ЗАГОЛОВОК ===== */
        .offline-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 14px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, .3);
        }

        /* ===== ТЕКСТ ===== */
        .offline-text {
            font-size: 1rem;
            line-height: 1.6;
            opacity: .9;
            margin-bottom: 26px;
        }

        /* ===== КНОПКА ===== */
        .offline-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            background: rgba(255, 255, 255, .25);
            border: 2px solid rgba(255, 255, 255, .5);
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            transition: all .3s;
        }

        .offline-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, .4);
            border-color: rgba(255, 255, 255, .8);
            box-shadow: 0 15px 40px rgba(0, 0, 0, .3);
        }

        .offline-btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
        }

        /* ===== ПОДПИСЬ ===== */
        .offline-footer {
            margin-top: 22px;
            font-size: .85rem;
            opacity: .7;
            letter-spacing: 1px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 480px) {
            .offline-card { padding: 30px 22px; }
            .offline-title { font-size: 1.5rem; }
            .offline-icon { width: 75px; height: 75px; font-size: 1.8rem; }
            .five, .up { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <div class="logo-container">
            <div class="esc-key"><span class="esc-text">Esc</span></div>
            <div class="fiveup-text">
                <span class="five">Five</span>
                <span class="up">Up</span>
            </div>
        </div>

        <div class="offline-icon">
            <i class="fas fa-triangle-exclamation"></i>
        </div>

        <h1 class="offline-title">Сайт снят с публикации</h1>

        <p class="offline-text">
             <br>
            В данный момент сайт недоступен и снят с публикации.
            
        </p>

        <button class="offline-btn" onclick="location.reload()">
  выйти
        </button>

        <div class="offline-footer">EscFiveUp &copy; 2026</div>
    </div>

</body>
</html>
